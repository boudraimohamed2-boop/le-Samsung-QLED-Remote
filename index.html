<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Samsung QLED Remote</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0c1220;color:white}body{margin:0;padding:24px 18px;text-align:center}h1{font-size:24px;margin:20px 0 5px}p{color:#b7c5da;font-size:14px}button{border:0;color:white;background:#27364f;border-radius:19px;font-size:22px;font-weight:600;min-height:65px;touch-action:manipulation}button:active{background:#497ac3}.power{background:#ad3348}.grid{max-width:400px;margin:22px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:span 3}.pair{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:12px}input{background:#18243a;border:1px solid #52627b;color:white;padding:13px;border-radius:12px;width:70%;font-size:16px}#status{min-height:35px;color:#e5c98e}small{color:#9eacc2}
</style></head><body>
<h1>📺 Samsung QLED</h1><p>Télécommande Wi‑Fi</p>
<input id="ip" placeholder="Adresse IP de la TV (ex. 192.168.1.20)" inputmode="decimal">
<div class="grid">
<button class="wide" id="connect">Connecter la TV</button>
<button class="power" data-key="KEY_POWER">⏻</button><button data-key="KEY_SOURCE">Source</button><button data-key="KEY_MUTE">🔇</button>
<button data-key="KEY_VOLUP">Vol +</button><button data-key="KEY_UP">▲</button><button data-key="KEY_CHUP">CH +</button>
<button data-key="KEY_LEFT">◀</button><button data-key="KEY_ENTER">OK</button><button data-key="KEY_RIGHT">▶</button>
<button data-key="KEY_VOLDOWN">Vol −</button><button data-key="KEY_DOWN">▼</button><button data-key="KEY_CHDOWN">CH −</button>
<button data-key="KEY_RETURN">↩ Retour</button><button data-key="KEY_HOME">⌂ Accueil</button><button data-key="KEY_MENU">☰ Menu</button>
<div class="pair"><button data-key="KEY_PLAY">▶ Lecture</button><button data-key="KEY_PAUSE">⏸ Pause</button></div>
</div>
<div id="status">Saisis l’adresse IP de ta TV.</div><small>iPhone et TV sur le même Wi‑Fi. L’allumage dépend du modèle.</small>
<script>
const ip=document.querySelector('#ip'),status=document.querySelector('#status');ip.value=localStorage.tvip||'';
let socket=null;
function message(s){status.textContent=s}
function connect(){const host=ip.value.trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(host)){message('Entre une adresse IP valide.');return}localStorage.tvip=host;
try{socket=new WebSocket('wss://'+host+':8002/api/v2/channels/samsung.remote.control?name='+btoa('iPhone Remote'));
message('Connexion en cours : accepte la demande sur la TV.');
socket.onopen=()=>message('Connecté à la TV !');socket.onerror=()=>message('Connexion impossible. Sur iPhone, le certificat TV peut bloquer cette page.');socket.onclose=()=>message('Connexion fermée.');}
catch(e){message('Erreur : '+e.message)}}
document.querySelector('#connect').onclick=connect;
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(!socket||socket.readyState!==1){message('Connecte d’abord la TV.');return}socket.send(JSON.stringify({method:'ms.remote.control',params:{Cmd:'Click',DataOfCmd:b.dataset.key,Option:'false',TypeOfRemote:'SendRemoteKey'}}))});
</script></body></html>
